site_name: Agent Builder Documentation
site_description: AI 생성 문서 자동화 시스템
site_author: miniforce1119
site_url: https://miniforce1119.github.io/Documents/
repo_url: https://github.com/miniforce1119/Documents
repo_name: miniforce1119/Documents
edit_uri: edit/main/agent-builder-automation/docs/

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: 
        - ko
        - en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - 분석 문서:
      - analysis/mkdocs-documentation-workflow.md
  - 가이드:
      - guides/agent-builder.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/miniforce1119/Documents
