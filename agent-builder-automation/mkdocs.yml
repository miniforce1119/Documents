site_name: Agent Builder Documentation
site_description: AI 생성 문서 자동화 시스템
site_author: miniforce1119
site_url: https://miniforce1119.github.io/Documents/
repo_url: https://github.com/miniforce1119/Documents
repo_name: miniforce1119/Documents
edit_uri: edit/main/agent-builder-automation/docs/

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: 
        - ko
        - en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
  - 홈: index.md
  - 강의 자료:
      - AI 기초: courses/ai-fundamentals.md
  - 가이드:
      - Agent Builder: guides/agent-builder.md
      - Docker 배포: guides/docker-deployment-guide.md
      - OpenClaw 원격 접속: guides/openclaw-remote-access.md
      - 바이브 코딩 MkDocs 가이드: guides/vibe-coding-mkdocs-guide.md
      - 강사용 시연 가이드: guides/instructor-demo-guide.md
      - HW AI 워크숍:
          - 워크숍 개요: guides/hw-ai-workshop/index.md
          - "프로젝트 1: 엑셀 인포그래픽": guides/hw-ai-workshop/project1-infographic.md
          - "프로젝트 2: NotebookLM 오디오": guides/hw-ai-workshop/project2-notebooklm.md
          - "프로젝트 3: MKDocs 사이트": guides/hw-ai-workshop/project3-mkdocs.md
          - "프로젝트 4: 텔레그램 봇": guides/hw-ai-workshop/project4-telegram-bot.md
  - 분석:
      - SystemUI Memory Regression: analysis/systemui-memory-regression-report.md
      - MkDocs 문서화 워크플로우: analysis/mkdocs-documentation-workflow.md
      - 2026 Q1 데이터 분석: analysis/2026-q1-data-analysis-report.md
      - Kubernetes 핵심 개념: analysis/kubernetes-core-concepts.md
      - RESTful API 설계: analysis/restful-api-design-guide.md
  - 개념:
      - Python Best Practices 2026: concepts/python-best-practices-2026.md
  - 프레젠테이션: presentations.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/miniforce1119/Documents
