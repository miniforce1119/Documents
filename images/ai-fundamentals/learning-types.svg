<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 10; }
      .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
      .text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .icon { font-size: 40px; }
    </style>
  </defs>
  
  <!-- 지도 학습 -->
  <rect x="20" y="20" width="230" height="260" class="box" fill="#e3f2fd"/>
  <text x="135" y="60" class="title" fill="#1976d2">지도 학습</text>
  <text x="135" y="85" class="text" fill="#424242">(Supervised Learning)</text>
  <text x="135" y="120" class="icon">👨‍🏫</text>
  <text x="135" y="160" class="text" fill="#424242">정답이 있는</text>
  <text x="135" y="185" class="text" fill="#424242">데이터로 학습</text>
  <text x="135" y="220" class="text" fill="#1976d2">예: 스팸 분류</text>
  <text x="135" y="245" class="text" fill="#1976d2">질병 진단</text>
  
  <!-- 비지도 학습 -->
  <rect x="285" y="20" width="230" height="260" class="box" fill="#f3e5f5"/>
  <text x="400" y="60" class="title" fill="#7b1fa2">비지도 학습</text>
  <text x="400" y="85" class="text" fill="#424242">(Unsupervised Learning)</text>
  <text x="400" y="120" class="icon">🔍</text>
  <text x="400" y="160" class="text" fill="#424242">정답 없이</text>
  <text x="400" y="185" class="text" fill="#424242">패턴 발견</text>
  <text x="400" y="220" class="text" fill="#7b1fa2">예: 고객 그룹화</text>
  <text x="400" y="245" class="text" fill="#7b1fa2">이상 탐지</text>
  
  <!-- 강화 학습 -->
  <rect x="550" y="20" width="230" height="260" class="box" fill="#e8f5e9"/>
  <text x="665" y="60" class="title" fill="#388e3c">강화 학습</text>
  <text x="665" y="85" class="text" fill="#424242">(Reinforcement Learning)</text>
  <text x="665" y="120" class="icon">🎮</text>
  <text x="665" y="160" class="text" fill="#424242">시행착오로</text>
  <text x="665" y="185" class="text" fill="#424242">보상 최대화</text>
  <text x="665" y="220" class="text" fill="#388e3c">예: 게임 AI</text>
  <text x="665" y="245" class="text" fill="#388e3c">자율주행</text>
</svg>
